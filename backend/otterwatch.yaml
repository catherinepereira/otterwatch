detector_defaults: &detector
  type: yolo-world
  prompt: otter swimming
  confidence_threshold: 0.35

debounce_defaults: &debounce
  sample_interval_s: 15.0
  enter_frames: 2
  exit_frames: 4
  cooldown_s: 60

sinks:
  supabase:
    bucket: thumbnails
    detector_label: yolo-world
    retention_hours: 3
    thumbnail_width: 960
  # webhook URL comes from DETSTREAM_DISCORD_WEBHOOK_URL in .env.
  # watch_urls maps feed_id to the stream link shown in the embed
  discord:
    watch_urls:
      monterey-otters: "https://www.youtube.com/watch?v=abbR-Ttd-cA"
      vancouver-otters-1: "https://www.youtube.com/watch?v=9mg9PoFEX2U"
      vancouver-otters-2: "https://www.youtube.com/watch?v=_KXHUb0wFRE"
      seattle-otters: "https://www.youtube.com/watch?v=NqOmHpwMUxs"

feeds:
  - id: monterey-otters
    name: Monterey Bay Aquarium
    source: { type: youtube-snapshot, url: "https://www.youtube.com/watch?v=abbR-Ttd-cA", max_height: 480 }
    detector: *detector
    debounce: *debounce
    sinks: [console, supabase]

  - id: vancouver-otters-1
    name: Vancouver Aquarium (Cam 1)
    source: { type: youtube-snapshot, url: "https://www.youtube.com/watch?v=9mg9PoFEX2U", max_height: 480 }
    detector: *detector
    debounce: *debounce
    sinks: [console, supabase]

  - id: vancouver-otters-2
    name: Vancouver Aquarium (Cam 2)
    source: { type: youtube-snapshot, url: "https://www.youtube.com/watch?v=_KXHUb0wFRE", max_height: 480 }
    detector: *detector
    debounce: *debounce
    sinks: [console, supabase]

  - id: seattle-otters
    name: Seattle Aquarium
    source: { type: youtube-snapshot, url: "https://www.youtube.com/watch?v=NqOmHpwMUxs", max_height: 480 }
    detector: *detector
    debounce: *debounce
    sinks: [console, supabase]
